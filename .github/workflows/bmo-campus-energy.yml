name: BMO Campus Energy Fetch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Default GITHUB_TOKEN may be read-only depending on repo settings —
# this job commits to main, so request write explicitly.
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    concurrency:
      group: bmo-energy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Fetch campus energy data
        env:
          BMO_USERNAME: ${{ secrets.BMO_USERNAME }}
          BMO_PASSWORD: ${{ secrets.BMO_PASSWORD }}
        run: python bmo_fetch_campus.py

      - name: Generate weekly report
        run: python generate_weekly_report.py || true

      - name: Build energy baseline / anomaly stats
        # Incremental: appends the fresh snapshot + rolling history to the
        # accumulated series cache, then recomputes hour-of-week medians and
        # z-scores. '|| true' so a stats hiccup never blocks the data commit.
        run: python scripts/build_baseline.py || true

      - name: Archive daily snapshot
        run: |
          TODAY=$(date +'%Y-%m-%d')
          cp data/campus_energy.json "data/archive/${TODAY}.json"
          cp data/building_data.json "data/archive/buildings_${TODAY}.json"
          echo "Archived: ${TODAY}"
      
      - name: Commit and push
        run: |
          git config user.name "BMO Auto-Fetcher"
          git config user.email "bmo@github-actions.bot"
          git add data/
          git diff --staged --quiet || git commit -m "🔋 Update campus energy $(date +'%H:%M')"
          # Rebase-retry: bmo-fetch.yml may push between our checkout and push
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep $((i * 5))
          done
