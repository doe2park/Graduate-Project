# One-shot BMO channel inventory: probes every known AcquiSuite device for
# all responding meter IDs and records their column headers, so we know which
# buildings expose water/gas/steam channels beyond electricity.
# Report is committed to the `data` branch.
name: Discover BMO Channels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: bmo-discovery
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data

      - name: Seed working data dir
        run: rsync -a _data/data/ data/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests==2.34.2

      - name: Probe devices
        env:
          BMO_USERNAME: ${{ secrets.BMO_USERNAME }}
          BMO_PASSWORD: ${{ secrets.BMO_PASSWORD }}
        run: python scripts/discover_channels.py

      - name: Commit report to data branch
        run: |
          rsync -a data/bmo_channels_report.json _data/data/bmo_channels_report.json
          cd _data
          git config user.name "BMO Channel Discovery"
          git config user.email "bmo@github-actions.bot"
          git add data/bmo_channels_report.json
          git diff --staged --quiet || git commit -m "🔎 BMO channel inventory"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin data && git push origin data; then ok=1; break; fi
            sleep $((i * 5))
          done
          if [ "$ok" != 1 ]; then echo "::error::push to data branch failed after 3 attempts"; exit 1; fi
