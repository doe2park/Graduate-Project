<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Weekly Energy Report · UC Berkeley Digital Twin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1020;--panel:rgba(15,23,42,.92);--border:rgba(253,181,21,.12);--gold:#FDB515;--cyan:#2dd4bf;--text:#e2e8f0;--dim:#64748b;--faint:#334155;--red:#f87171;--green:#34d399;--mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}
a{color:var(--cyan);text-decoration:none}
.hdr{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px);flex-wrap:wrap}
.hdr-back{padding:6px 14px;border-radius:8px;border:1px solid var(--border);color:var(--dim);font-size:12px;font-weight:600}
.hdr-back:hover{border-color:var(--gold);color:var(--gold)}
.hdr h1{font-size:16px;color:var(--gold);font-weight:700}
.hdr-period{margin-left:auto;font-size:10px;color:var(--dim);font-family:var(--mono)}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
.stat-lbl{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-val{font:700 24px/1 var(--mono)}
.stat-sub{font-size:9px;color:var(--dim);margin-top:4px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.card-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card-title span{font-size:9px;color:var(--dim);font-weight:400;margin-left:auto}
.chart-box{position:relative;height:220px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:768px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hdr h1{font-size:13px}}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:11px}
.tbl th{text-align:left;font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;padding:6px 10px;border-bottom:1px solid var(--faint)}
.tbl td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
.tbl tr:hover td{background:rgba(253,181,21,.03)}
.day-card{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.day-item{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.day-name{font-size:10px;color:var(--dim);margin-bottom:2px}
.day-date{font-size:8px;color:var(--faint);margin-bottom:6px;font-family:var(--mono)}
.day-kw{font:700 18px var(--mono);color:var(--gold)}
.day-sub{font-size:8px;color:var(--dim);margin-top:2px}
#loading{display:flex;align-items:center;justify-content:center;height:60vh;color:var(--dim);font-size:14px;gap:10px}
.spin{width:20px;height:20px;border:2px solid var(--faint);border-top-color:var(--cyan);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--dim);font-size:13px}
.nav{display:flex;gap:8px;margin-bottom:16px}
.nav a{padding:6px 14px;border-radius:8px;border:1px solid var(--border);color:var(--dim);font-size:11px;font-weight:600}
.nav a:hover,.nav a.active{border-color:var(--gold);color:var(--gold);background:rgba(253,181,21,.08)}

.intro{margin:10px 0 20px}.intro h2{font-size:26px;margin:6px 0 8px;font-weight:600}.intro p,.notice,details p{color:#94a3b8;line-height:1.6;font-size:12px}.eyebrow{font:10px var(--mono);color:var(--cyan);letter-spacing:1.5px}.notice{margin:0 0 16px;padding:12px 16px;border-left:2px solid #64748b}.stat-val{color:#e2e8f0;font-size:26px}.stat-val small{font-size:12px;color:#94a3b8}.stat-sub{line-height:1.5;margin-top:8px}.stat-lbl{color:#94a3b8}.grid2>*{min-width:0}.table-scroll{overflow-x:auto;max-width:100%}.card{min-width:0}.card-title button{margin-left:auto}button{background:#142239;border:1px solid #34445f;border-radius:6px;color:#cbd5e1;padding:8px 12px;cursor:pointer}button:disabled{opacity:.35;cursor:default}summary{cursor:pointer;font-size:12px}details p{margin-top:12px}.tbl td{padding:10px}.hdr{position:relative}#weekNav{flex-wrap:wrap}.hdr-period{line-height:1.5}@media(max-width:600px){.hdr{padding:12px;gap:10px}.hdr h1{font-size:16px}.hdr-period{margin-left:0;width:100%}.wrap{padding:12px}.intro h2{font-size:23px}.stat-val{font-size:20px}.card-title{flex-wrap:wrap}.card-title span{margin-left:0}.stats{gap:8px}.stat{padding:12px}.chart-box{height:200px}}
</style>
</head>
<body>
<div class="hdr">
  <a href="grimes-campus-map-arcgis.html" class="hdr-back">← Map</a>
  <a href="campus-energy-dashboard.html" class="hdr-back">← Energy Dashboard</a>
  <h1>Weekly Energy Report</h1>
  <div id="weekNav" style="display:flex;align-items:center;gap:6px;margin-left:8px"><button onclick="changeWeek(-1)" id="prevBtn" style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;font-size:11px">← Prev</button><span id="weekLabel" style="font-size:10px;color:var(--cyan);font-family:var(--mono);min-width:80px;text-align:center">This week</span><button onclick="changeWeek(1)" id="nextBtn" style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;font-size:11px" disabled>Next →</button></div><div class="hdr-period" id="period">--</div>
</div>
<div class="wrap" id="app"><div id="loading"><div class="spin"></div>Loading report...</div></div>

<script>
const REPORT_URL='https://raw.githubusercontent.com/doe2park/Graduate-Project/data/data/weekly_report.json';
const ARCHIVE_BASE='https://raw.githubusercontent.com/doe2park/Graduate-Project/data/data/daily/';
let weekOffset=0, archiveDays=[], names={}, charts=[], epoch=0, currentRows=[];
const cache=new Map();
function shiftDate(date,n){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function getArchiveDate(o){return shiftDate(archiveDays.at(-1),o*7)}
function changeWeek(dir){weekOffset=Math.min(0,weekOffset+dir);init()}
function finite(v){return typeof v==='number' && Number.isFinite(v) && v>=0}
function summarizeDays(entries){
 const daily=[], buildings={};let all=[];
 for(const [date,data] of entries){
  const rows=(data?.readings||[]).filter(r=>finite(r.total_kw));
  if(!rows.length)continue;
  const kws=rows.map(r=>r.total_kw),avg=kws.reduce((a,b)=>a+b,0)/kws.length;
  all.push(...kws);
  daily.push({date,day:new Date(date+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'long',timeZone:'UTC'}),avg_kw:avg,peak_kw:Math.max(...kws),min_kw:Math.min(...kws),readings_count:kws.length,est_kwh:avg*24,est_cost:avg*24*.15,est_co2_kg:avg*24*.21});
  for(const row of data.readings||[])for(const [id,kw]of Object.entries(row.buildings||{}))if(finite(kw)){buildings[id]??={values:[],dates:new Set()};buildings[id].values.push(kw);buildings[id].dates.add(date)}
 }
 const rank={};for(const [id,b]of Object.entries(buildings)){const avg=b.values.reduce((a,c)=>a+c,0)/b.values.length;rank[id]={avg_kw:avg,peak_kw:Math.max(...b.values),min_kw:Math.min(...b.values),readings:b.values.length,days:b.dates.size}}
 return {daily,rank:Object.fromEntries(Object.entries(rank).sort((a,b)=>b[1].avg_kw-a[1].avg_kw)),count:all.length,avg:all.length?all.reduce((a,b)=>a+b,0)/all.length:null,peak:all.length?Math.max(...all):null};
}
function fmt(v){return finite(v)?v.toLocaleString('en-US',{maximumFractionDigits:1}):'—'}
function safe(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function downloadCSV(){
 const rows=[['archive_date','samples','sample_mean_kw','sample_peak_kw','sample_min_kw','estimated_kwh_24h'],...currentRows.map(d=>[d.date,d.readings_count,d.avg_kw,d.peak_kw,d.min_kw,d.est_kwh])];
 const url=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='campus-week-ending-'+getArchiveDate(weekOffset)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)
}
const NAMES_URL='https://raw.githubusercontent.com/doe2park/Graduate-Project/data/data/campus_energy.json';

Chart.defaults.color='#64748b';
Chart.defaults.borderColor='rgba(255,255,255,.06)';
Chart.defaults.font.family="'JetBrains Mono',monospace";
Chart.defaults.font.size=10;

var tooltipOpts={backgroundColor:'rgba(10,16,32,.95)',borderColor:'rgba(253,181,21,.3)',borderWidth:1,titleFont:{size:11,weight:'bold'},bodyFont:{size:12,family:"'JetBrains Mono',monospace"},padding:10,cornerRadius:8};

async function getDay(date){
 if(cache.has(date))return cache.get(date);
 const r=await fetch(ARCHIVE_BASE+date+'.json');if(!r.ok)throw Error('Archive unavailable: '+date);
 const d=await r.json();cache.set(date,d);return d;
}
async function init(){
 const token=++epoch,app=document.getElementById('app');
 charts.forEach(c=>c.destroy());charts=[];app.innerHTML='<div class="empty" role="status">Loading archived observations…</div>';
 try{
  if(!archiveDays.length){
   const r=await fetch(ARCHIVE_BASE+'index.json');if(!r.ok)throw Error('Archive index unavailable');
   const idx=await r.json();archiveDays=[...new Set((idx.days||[]).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)))].sort();if(!archiveDays.length)throw Error('No archive yet');
   try{const n=await(await fetch(NAMES_URL)).json();names=Object.fromEntries(Object.entries(n.buildings||{}).map(([id,b])=>[id,b.name]));}catch{}
  }
  const end=getArchiveDate(weekOffset),start=shiftDate(end,-6),dates=archiveDays.filter(d=>d>=start&&d<=end);
  document.getElementById('prevBtn').disabled=start<=archiveDays[0];document.getElementById('nextBtn').disabled=weekOffset===0;
  document.getElementById('weekLabel').textContent=weekOffset===0?'Latest 7 days':'Week ending '+end;
  const results=await Promise.allSettled(dates.map(async d=>[d,await getDay(d)]));if(token!==epoch)return;
  const failed=results.filter(r=>r.status==='rejected').length;
  const report=summarizeDays(results.filter(r=>r.status==='fulfilled').map(r=>r.value)),days=report.daily,bldgs=report.rank;
  currentRows=days;
  document.getElementById('period').textContent=start+' → '+end+' · archive dates (UTC)';
  if(!days.length){app.innerHTML='<div class="empty">No usable observations in this window. Try another week.</div>';return}
  const energy=days.reduce((a,d)=>a+d.est_kwh,0);
  app.innerHTML=`
   <div class="intro"><div class="eyebrow">OPERATING HISTORY</div><h2>A week of campus demand</h2><p>Review daily patterns and building rankings from retained BMO snapshots.</p></div>
   <div class="stats">
    <div class="stat"><div class="stat-lbl">Sample mean demand</div><div class="stat-val">${fmt(report.avg)} <small>kW</small></div><div class="stat-sub">Across available observations</div></div>
    <div class="stat"><div class="stat-lbl">Observed peak</div><div class="stat-val">${fmt(report.peak)} <small>kW</small></div><div class="stat-sub">Highest archived snapshot</div></div>
    <div class="stat"><div class="stat-lbl">Archive coverage</div><div class="stat-val">${days.length}<small> / 7 days</small></div><div class="stat-sub">${report.count} snapshots · irregular intervals</div></div>
    <div class="stat"><div class="stat-lbl">Estimated energy</div><div class="stat-val">${fmt(energy/1000)} <small>MWh</small></div><div class="stat-sub">Daily sample mean × 24 h, summed</div></div>
   </div>
   <p class="notice">${failed?failed+' archive file(s) could not be loaded. ':''}Snapshots are not continuous meter histories. Missing dates stay empty; changing building coverage can affect campus totals. The latest day may be partial.</p>
   <div class="grid2"><div class="card"><div class="card-title">Daily sample mean <span>kW · tap a bar</span></div><div class="chart-box"><canvas id="dailyBar" aria-label="Daily sample mean demand" role="img"></canvas></div></div><div class="card"><div class="card-title">Observed range <span>Peak / mean / minimum</span></div><div class="chart-box"><canvas id="peakLine" aria-label="Daily observed range" role="img"></canvas></div></div></div>
   <div class="card"><div class="card-title">Daily observations <button onclick="downloadCSV()">Download CSV</button></div><div class="table-scroll"><table class="tbl"><thead><tr><th>Date (UTC)</th><th>Samples</th><th>Mean kW</th><th>Peak kW</th><th>Est. kWh / day</th></tr></thead><tbody>${Array.from({length:7},(_,i)=>{const date=shiftDate(start,i),d=days.find(d=>d.date===date);return `<tr><td>${date}</td><td>${d?d.readings_count:'No data'}</td><td>${fmt(d?.avg_kw)}</td><td>${fmt(d?.peak_kw)}</td><td>${fmt(d?.est_kwh)}</td></tr>`}).join('')}</tbody></table></div></div>
   <div class="card"><div class="card-title">Building rankings <span>Sample mean · available readings only</span></div><div class="table-scroll"><table class="tbl"><thead><tr><th>Building</th><th>Mean kW</th><th>Peak kW</th><th>Days</th><th>Samples</th></tr></thead><tbody>${Object.entries(bldgs).map(([id,b])=>`<tr><td>${safe(names[id]||id)}</td><td>${fmt(b.avg_kw)}</td><td>${fmt(b.peak_kw)}</td><td>${b.days}/7</td><td>${b.readings}</td></tr>`).join('')}</tbody></table></div></div>
   <details class="card"><summary>Sources and interpretation</summary><p>Daily collector snapshots are stored on the automated data branch. Archive dates reflect the collector clock (UTC on GitHub Actions), not a reconstructed Pacific-day meter series. Historical snapshots do not retain every meter timestamp or quality flag, so freshness cannot be verified retrospectively.</p><p>Demand is summarized from recorded kW values, including recorded zero. Energy is an extrapolation, not a counter-based measurement. Unequal sampling and incomplete coverage limit week-to-week comparisons.</p><p><a href="grimes-performance.html">For Grimes counter-based daily energy →</a></p></details>`;
  // Keep all seven calendar dates so absent days break the line.
  const chartDays=Array.from({length:7},(_,i)=>days.find(d=>d.date===shiftDate(start,i))||{date:shiftDate(start,i),avg_kw:null,peak_kw:null,min_kw:null});
  // Charts
  var labels=chartDays.map(d=>d.date.slice(5));

  charts.push(new Chart(document.getElementById('dailyBar'),{type:'bar',data:{labels:labels,datasets:[{data:chartDays.map(function(d){return d.avg_kw}),backgroundColor:'rgba(45,212,191,.65)',borderRadius:6,barThickness:28}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:Object.assign({},tooltipOpts,{callbacks:{label:function(ctx){var d=chartDays[ctx.dataIndex];return d.date+': '+fmt(d.avg_kw)+' kW mean'}}})},scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:'rgba(255,255,255,.04)'},ticks:{callback:function(v){return v+'kW'}}}}}}));

  charts.push(new Chart(document.getElementById('peakLine'),{type:'line',data:{labels:labels,datasets:[{label:'Peak',data:chartDays.map(function(d){return d.peak_kw}),borderColor:'#f87171',backgroundColor:'rgba(248,113,113,.1)',fill:true,tension:0,pointRadius:4,borderWidth:2},{label:'Average',data:chartDays.map(function(d){return d.avg_kw}),borderColor:'#FDB515',backgroundColor:'rgba(253,181,21,.1)',fill:true,tension:0,pointRadius:4,borderWidth:2},{label:'Min',data:chartDays.map(function(d){return d.min_kw}),borderColor:'#34d399',borderDash:[4,4],tension:0,pointRadius:3,borderWidth:1.5}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{boxWidth:8,font:{size:9}}},tooltip:tooltipOpts},scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:'rgba(255,255,255,.04)'},ticks:{callback:function(v){return v+'kW'}}}}}}));

 }catch(e){if(token===epoch)app.innerHTML='<div class="empty">Could not load the archive. <button onclick="init()">Retry</button></div>'}
}
init();
</script></body></html>
