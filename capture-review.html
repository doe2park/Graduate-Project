<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capture intake review</title><style>
*{box-sizing:border-box}body{margin:0;background:#101923;color:#fff;font:14px Arial}header{padding:12px;min-height:100px}h1{font-size:18px;margin:0 0 8px}p{margin:5px 0;color:#c4d4e6}main{display:grid;grid-template-columns:1fr 1fr;height:calc(100dvh - 125px)}section{position:relative;min-width:0;min-height:0;border:1px solid #456}iframe{width:100%;height:100%;border:0}canvas{display:block;touch-action:none}button,a{color:#fff;background:#244562;border:1px solid #abc;border-radius:4px;padding:7px;display:inline-block}#modelStatus{position:absolute;top:0;left:0;background:#101923cf;padding:10px;max-width:100%;pointer-events:none}#pick{position:absolute;bottom:8px;left:8px;right:8px;background:#101923dd;padding:8px;white-space:pre-wrap;pointer-events:none}#fit{position:absolute;right:8px;top:60px}@media(max-width:650px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr;height:calc(100dvh - 155px)}header{font-size:12px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script></head><body><header><h1 id="title">New capture review</h1><p id="status">Choose a project prepared by scripts/capture_import.py.</p><label><input type="checkbox" id="align" disabled>Preview provisional landmark alignment</label> <a id="report" hidden>Intake report</a><p>Intake preview · No live feeds configured · Existing Grimes viewer is separate</p></header><main><section><iframe id="photo" title="Imported 360 photos"></iframe></section><section id="modelPane"><div id="modelStatus">No BIM loaded</div><button id="fit" disabled>Fit model</button><div id="pick">Click a model object to inspect its source node. NO FEED</div></section></main><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
const $=id=>document.getElementById(id),frame=$('photo'),pane=$('modelPane'),status=$('status');let registration=null,lastPose=null,group=null,epoch=1;
function local(path,base=location.href){const u=new URL(path,base);if(u.origin!==location.origin||!['http:','https:'].includes(u.protocol))throw Error('Project files must use this local server');return u;}
async function read(url){const r=await fetch(url);if(!r.ok)throw Error('File unavailable: '+new URL(url).pathname);return r.json();}
const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));pane.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#182637');const camera=new THREE.PerspectiveCamera(65,1,.01,10000);camera.position.set(10,10,10);const controls=new OrbitControls(camera,renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x888888,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(5,10,5);scene.add(light);
function resize(){const w=pane.clientWidth,h=pane.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(pane);
function fit(){if(!group)return;const box=new THREE.Box3().setFromObject(group);if(box.isEmpty())return;const c=box.getCenter(new THREE.Vector3()),r=box.getSize(new THREE.Vector3()).length()/2;controls.target.copy(c);camera.position.copy(c).add(new THREE.Vector3(1,.7,1).normalize().multiplyScalar(Math.max(1,r/Math.sin(Math.atan(Math.tan(camera.fov*Math.PI/360)*Math.min(1,camera.aspect)))*1.1)));camera.lookAt(c);controls.update();}
$('fit').onclick=fit;
function sync(){if(!$('align').checked||!registration||!lastPose)return;const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),registration.rotationYDegrees*Math.PI/180);camera.position.fromArray(lastPose.position).applyQuaternion(q).add(new THREE.Vector3().fromArray(registration.translation));camera.quaternion.fromArray(lastPose.quaternion).premultiply(q);camera.fov=lastPose.fov;camera.zoom=lastPose.zoom;camera.updateProjectionMatrix();}
$('align').onchange=()=>{controls.enabled=!$('align').checked;$('fit').disabled=$('align').checked||!group;if(!$('align').checked)controls.target.copy(camera.position).addScaledVector(camera.getWorldDirection(new THREE.Vector3()),5);sync();};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;const d=e.data;if(d?.type==='grimes-camera-ready'||d?.type==='grimes-claim-camera')frame.contentWindow.postMessage({type:'grimes-camera-role',driver:'scan',epoch,linked:false},location.origin);if(d?.type==='grimes-camera-pose'||d?.type==='grimes-claim-camera'){const p=d.pose;if(p&&p.position?.length===3&&p.quaternion?.length===4&&[...p.position,...p.quaternion,p.fov,p.zoom].every(Number.isFinite)&&p.fov>0&&p.fov<180&&p.zoom>0){lastPose=p;sync();}}});
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{if(!group)return;const rect=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObject(group,true)[0];if(!hit)return;let o=hit.object;while(o&&!o.name&&!o.userData?.name)o=o.parent;$('pick').textContent='Source node: '+(o?.userData?.name||o?.name||'(unnamed)')+'\nNO FEED · Node label only; element sidecar/binding must be configured for this building.';});
renderer.setAnimationLoop(()=>{if(controls.enabled)controls.update();renderer.render(scene,camera);});
try{const arg=new URLSearchParams(location.search).get('project');if(!arg)throw Error('Add ?project=capture-local/<capture>/project.json after importing.');const url=local(arg),p=await read(url);if(p.schema!=='capture-project/1')throw Error('Unsupported project manifest');$('title').textContent=p.building+' · '+p.level+' · '+p.captureDate;status.textContent='Unregistered capture · Verify floor, units, orientation and route';frame.src='scan-photo.html?manifest='+encodeURIComponent(local(p.panoramas,url).href);$('report').href=local('intake-report.json',url);$('report').hidden=false;
if(p.model){$('modelStatus').textContent='Loading imported model…';const loader=new GLTFLoader(),draco=new DRACOLoader();draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');loader.setDRACOLoader(draco);try{const gltf=await loader.loadAsync(local(p.model.file,url).href);group=gltf.scene;scene.add(group);fit();$('fit').disabled=false;$('modelStatus').textContent='Imported BIM · Original geometry · NO FEED';}finally{draco.dispose();}}
if(p.registration&&group){const c=await read(local(p.registration,url));if(c.status!=='provisional-landmarks'||c.scale!==1||!Number.isFinite(c.rotationYDegrees)||c.translation?.length!==3||!c.translation.every(Number.isFinite))throw Error('Invalid provisional registration');registration=c;$('align').disabled=false;status.textContent='Provisional landmark fit · Independent check max '+Number(c.checkMaxMetres).toFixed(3)+' m · Not surveyed accuracy';}
}catch(e){status.textContent=e.message;}
window.captureReviewInspection=()=>({modelReady:!!group,registrationReady:!!registration,aligned:$('align').checked,position:camera.position.toArray(),quaternion:camera.quaternion.toArray()});
</script></body></html>
