const prevButtons=new Map();
function xrInput(){
 for(const c of controllers){const src=c.userData.source,gp=src?.gamepad;if(!gp||gp.mapping!=='xr-standard')continue;
  const was=prevButtons.get(c)||[],now=gp.buttons.map(b=>b.pressed),edge=k=>now[k]&&!was[k];prevButtons.set(c,now);

  if(edge(5))setMenu(!state.menu);                                        // B / Y

   if(a==='forward'||a==='back'){state.opacity[state.mode]=X.stepOpacity(state.opacity[state.mode],a==='forward'?1:-1);applyShaderState();}
   else if(a){state.coneDeg=X.stepCone(state.coneDeg,a==='turn-right'?1:-1);applyShaderState();}

   c.userData.aim=false;c.userData.stick.armed=true;ring.visible=false;c.userData.ray.scale.z=3;

  if(a==='forward'||a==='back'){c.updateMatrixWorld(true);const d=new THREE.Vector3(0,0,-1).transformDirection(c.matrixWorld);if(a==='back')d.negate();walk(d);}

 }

 if(c){c.updateMatrixWorld(true);U.coneOrigin.value.setFromMatrixPosition(c.matrixWorld);U.coneDir.value.set(0,0,-1).transformDirection(c.matrixWorld);}else coneFromView();

   splats:gauss.count,loadMs:gauss.loadMs,loading:gauss.loading,error:gauss.error,overrideNote:gauss.overrideNote,override:gauss.override,zone:gauss.manifest?.zone?.id??null,zoneStations:gauss.stationIdx?.length??null,
   sortRunning:!!gauss.dropIn?.viewer.sortRunning,splatVisible:!!gauss.dropIn?.visible,teleports:gauss.teleports,eyeHeight:EYE_H,sharedMemory:false,renderer:'GaussianSplats3D 0.4.7 DropInViewer'}};}

window.xrDebug={renderNow(){renderer.render(scene,camera);const r=renderer.info.render;lastInfo={calls:r.calls,triangles:r.triangles,lines:r.lines,points:r.points};return lastInfo;},
