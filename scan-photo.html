window.tip=text=>{status.textContent=text;status.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>status.classList.remove('show'),6000);};
const defaultTip=touch?'Drag to look \u00b7 arrows (bottom right) walk the capture route':'Drag to look \u00b7 WASD / arrows walk the capture route \u00b7 photos blend between recorded positions';
function openMenu(open){menu.hidden=!open;toggle.setAttribute('aria-expanded',String(open));}
function setPad(on){pad.hidden=!on;padBtn.setAttribute('aria-checked',String(on));}
function fold(closed){document.body.classList.toggle('controls-collapsed',closed);document.getElementById('barToggle').textContent=closed?'Show toolbar':'Hide toolbar';}
toggle.onclick=e=>{e.stopPropagation();openMenu(menu.hidden);if(!menu.hidden)menu.querySelector('button:not(:disabled)').focus();};
document.addEventListener('pointerdown',e=>{if(!menu.hidden&&!menu.contains(e.target)&&e.target!==toggle)openMenu(false);},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){openMenu(false);toggle.focus();}});
padBtn.onclick=()=>setPad(pad.hidden);
document.getElementById('tipsBtn').onclick=()=>{openMenu(false);tip(defaultTip);};
document.getElementById('barToggle').onclick=()=>{fold(!document.body.classList.contains('controls-collapsed'));openMenu(false);};
if(touch&&!document.getElementById('padToggle').disabled)setPad(true);
tip(defaultTip);
})();</script></body></html>
