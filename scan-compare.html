<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grimes · Scan and BIM comparison</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#0b1522;color:#eaf2fa}header{height:64px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #38506a}h1{margin:0;font-size:17px}header p{margin:5px 0 0;color:#becad7;font-size:12px}main{height:calc(100dvh - 64px);display:grid;grid-template-columns:1fr 1fr;gap:3px;background:#49617d}section{display:flex;flex-direction:column;min-width:0;min-height:0;background:#101d2c}h2{display:flex;align-items:center;gap:8px;margin:0;padding:10px 14px;font-size:14px;height:38px;background:#132b40}h2 span{font-weight:normal;color:#b4cbdc;margin-left:10px;font-size:11px}#captureDate,#scanMode{font:12px Arial;background:#244562;color:white;border:1px solid #8aa5bb;border-radius:4px;padding:3px}iframe{border:0;width:100%;flex:1;min-height:0;background:#0a111c}@media(max-width:600px){header{height:78px}main{height:calc(100dvh - 78px);grid-template-columns:1fr;grid-template-rows:1fr 1fr}header p{max-width:330px}h2{height:auto;min-height:38px;padding:5px 8px;gap:5px;flex-wrap:wrap}#captureDate,#scanMode{max-width:140px;font-size:11px}h2 span{margin-left:0}}header{height:auto;min-height:64px;box-sizing:border-box}body{height:100dvh;display:flex;flex-direction:column}main{height:auto;flex:1;min-height:0}.rights-link{display:inline-block;font-size:10px;line-height:1.3;color:#b9cfdf;text-decoration:underline;max-width:100%}@media(max-width:600px){header{min-height:78px;padding:8px}header p{margin:3px 0}}</style></head><body><header><div><h1>Grimes · Scan ↔ BIM</h1><p><span id="linkStatus">Reading registration…</span></p><a class="rights-link" href="rights.html" target="_blank" rel="noopener">© 2026 Yoonsung Chung · Rights &amp; use</a></div><label style="white-space:nowrap;font-size:13px"><input id="linkCameras" type="checkbox" disabled>Keep views aligned</label></header><main><section aria-label="Actual scan"><h2>Actual scan <select id="scanMode" aria-label="Scan display"><option value="photo">360° photos</option><option value="mesh">3D mesh</option><option value="splat" disabled>Gaussian · May experiment</option></select><select id="captureDate" aria-label="Capture date"><option value="2026-09-17">Sep 17, 2026 · New</option><option value="2026-05-06">May 6, 2026</option></select></h2><iframe title="Captured scan" src="about:blank" allow="fullscreen; pointer-lock"></iframe></section><section aria-label="BIM model"><h2>BIM model <span>Level 1 · Interior and systems</span></h2><iframe title="BIM elements" src="scan-bim.html?pane=bim&amp;revision=walk4" allow="fullscreen; pointer-lock"></iframe></section></main><script>
const frames=document.querySelectorAll('iframe'),link=document.getElementById('linkCameras'),status=document.getElementById('linkStatus');
/* CAPTURE SELECTION */
function captureSelection(search){
 const q=new URLSearchParams(search),old=q.get('mode')==='splat'||q.get('capture')==='2026-05-06';
 const date=old?'2026-05-06':'2026-09-17';
 return {date,provisional:!old,photo:old?'scan-assets/panoramas/manifest.json':'scan-assets/captures/2026-09-17/panoramas/manifest.json',registration:old?'alignment-analysis/accepted-registration.json':'scan-assets/captures/2026-09-17/registration.json',mesh:'scan-bim.html?pane=scan&capture='+date+'&revision=walk-cameras2'};
}
/* END CAPTURE SELECTION */
const capture=captureSelection(location.search),capturePicker=document.getElementById('captureDate');capturePicker.value=capture.date;
function navigateCapture(date,display){const u=new URL(location.href);u.searchParams.set('capture',date);u.searchParams.set('mode',display);location.assign(u);}
capturePicker.onchange=()=>navigateCapture(capturePicker.value,mode.value==='splat'?'photo':mode.value);
let photoMode=true,photoAnchor=null,photoMoving=false;
const mode=document.getElementById('scanMode');
mode.onchange=()=>navigateCapture(mode.value==='splat'?'2026-05-06':capture.date,mode.value);
const requestedMode=new URLSearchParams(location.search).get('mode');
if(requestedMode==='mesh'){mode.value='mesh';photoMode=false;frames[0].src=capture.mesh;}
else frames[0].src='scan-photo.html?manifest='+encodeURIComponent(capture.photo);

let registration=null,driver='scan',epoch=0;const poses={};
const index=p=>p==='scan'?0:1,other=p=>p==='scan'?'bim':'scan';
const send=(pane,data)=>frames[index(pane)].contentWindow.postMessage(data,location.origin);
function valid(p){return p&&Array.isArray(p.position)&&p.position.length===3&&Array.isArray(p.quaternion)&&p.quaternion.length===4&&[...p.position,...p.quaternion,p.fov,p.zoom].every(Number.isFinite)&&p.fov>0&&p.fov<180&&p.zoom>0;}
function convert(p,from){
 const a=registration.rotationYDegrees*Math.PI/180,c=Math.cos(a),s=Math.sin(a),t=registration.translation;
 let [x,y,z]=p.position;let position;
 if(from==='scan')position=[c*x+s*z+t[0],y+t[1],-s*x+c*z+t[2]];
 else{x-=t[0];y-=t[1];z-=t[2];position=[c*x-s*z,y,s*x+c*z];}
 const h=Math.sin((from==='scan'?a:-a)/2),w=Math.cos(a/2),[qx,qy,qz,qw]=p.quaternion;
 return{position,quaternion:[w*qx+h*qz,w*qy+h*qw,w*qz-h*qx,w*qw-h*qy],fov:p.fov,zoom:p.zoom};
}
function acceptedPose(p,pane){if(photoMode){if(pane==='scan')photoAnchor=p.position.slice();else if(photoAnchor&&registration)p={...p,position:convert({...p,position:photoAnchor},'scan').position};}return p;}
function sync(){if(!link.checked||!registration||!poses[driver])return;const target=other(driver),pose=convert(poses[driver],driver);poses[target]=pose;send(target,{type:'grimes-linked-pose',epoch,pose});}
function roles(){send('bim',{type:'grimes-photo-mode',enabled:photoMode});for(const pane of ['scan','bim'])send(pane,{type:'grimes-camera-role',epoch,driver,linked:link.checked});status.textContent=link.checked?photoMode?(capture.provisional?'Provisional alignment · ':'Aligned photos · ')+'Drag either view · WASD follows capture route':(mode.value==='splat'?'Aligned Gaussian experiment · ':(capture.provisional?'Provisional alignment · ':'Aligned views · '))+'Move either pane · '+(driver==='scan'?'Scan':'BIM')+' controls both':'Independent cameras';sync();}
window.addEventListener('message',e=>{
 if(e.origin!==location.origin)return;const pane=e.source===frames[0].contentWindow?'scan':e.source===frames[1].contentWindow?'bim':null;if(!pane)return;const d=e.data;
 if(d?.type==='grimes-photo-transition'&&pane==='scan'&&photoMode){photoMoving=!!d.moving;if(!photoMoving)roles();return;}
 if(photoMoving&&pane==='bim'&&d?.type==='grimes-claim-camera'){roles();return;}
 if(d?.type==='grimes-camera-ready'){roles();return;}
 if(d?.type==='grimes-photo-step'&&pane==='bim'&&photoMode){send('scan',{type:'grimes-photo-step',delta:d.delta,direction:d.direction});return;}
 if(d?.type==='grimes-claim-camera'){driver=pane;epoch++;if(valid(d.pose))poses[pane]=acceptedPose(d.pose,pane);roles();return;}
 if(d?.type==='grimes-request-link'){link.checked=true;epoch++;roles();return;}
 if(d?.type!=='grimes-camera-pose'||d.epoch!==epoch||!valid(d.pose))return;
 if(link.checked&&pane!==driver)return;poses[pane]=acceptedPose(d.pose,pane);if(pane===driver)sync();
});
link.onchange=()=>{epoch++;roles()};
fetch('capture-local/gaussian/pilot/viewer.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(m=>{if(m.status!=='experimental-trained'||m.frame!=='scan-y-up-metres')return;mode.querySelector('[value=splat]').disabled=false;if(new URLSearchParams(location.search).get('mode')==='splat'){mode.value='splat';photoMode=false;frames[0].src='scan-splat.html?revision=gaussian1';epoch++;roles();}}).catch(()=>{});
fetch(capture.registration,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(c=>{if(c.status!==(capture.provisional?'project-frame-provisional':'geometry-registered')||!Number.isFinite(c.rotationYDegrees)||!Array.isArray(c.translation)||c.translation.length!==3||!c.translation.every(Number.isFinite))throw Error();registration=c;link.disabled=false;link.checked=true;epoch++;roles()}).catch(()=>status.textContent='Independent cameras · Registration unavailable');
</script></body></html>
