{const o=['localhost','127.0.0.1'].includes(location.hostname)?new URLSearchParams(location.search).get('manifest'):null;if(o&&/^[\w.\/-]+\.json$/.test(o)&&!o.includes('..'))GAUSSIAN_MANIFEST=o;}

function sendHeadingOffsets(){if(!photoMode)return;const data={type:'grimes-heading-offsets',offsets:registrationPreview?headingOffsets(registration):{}};frames[0].contentWindow?.postMessage(data,location.origin);edgeSend(data);}
function useRegistration(c,preview){registration=c;registrationPreview=preview;link.disabled=view==='overlay';link.checked=true;epoch++;roles();}
function loadDefaultRegistration(note){return fetch(capture.registration,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(c=>{if(c.status!==(capture.provisional?'project-frame-provisional':'geometry-registered')||!Number.isFinite(c.rotationYDegrees)||!Array.isArray(c.translation)||c.translation.length!==3||!c.translation.every(Number.isFinite))throw Error();useRegistration(c,false);if(note)status.textContent=note+' \u00b7 '+status.textContent;}).catch(()=>status.textContent='Independent cameras · Registration unavailable');}
const candidatePath=registrationOverride(location.search);
if(candidatePath&&candidatePath!=='invalid')fetch(candidatePath,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('candidate not found');return r.json()}).then(c=>{const v=RegistrationCore.validateRegistration(c,capture.date);if(!v.ok)throw Error(v.reason);useRegistration(c,true);}).catch(e=>loadDefaultRegistration('Candidate rejected ('+(e.message||'invalid')+'), showing default'));
else loadDefaultRegistration(candidatePath==='invalid'?'Candidate path rejected, showing default':'');
</script></body></html>
